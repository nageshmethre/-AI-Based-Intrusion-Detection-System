version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: soc_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./soc_platform.db
      - JWT_SECRET=soc-cybersecurity-secret-key-change-in-production-2026-auth
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
    volumes:
      - soc_data:/app/data
      - ./reports:/app/reports
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: soc_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  soc_data:
